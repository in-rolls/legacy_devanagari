[project]
name = "legacy-devanagari"
version = "0.1.0"
description = "Convert text set in legacy (pre-Unicode) Devanagari font encodings, starting with Akruti Dev, to Unicode"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "contact@gsood.com" }]
keywords = ["devanagari", "hindi", "unicode", "akruti", "legacy fonts", "transcoding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: Hindi",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/in-rolls/legacy_devanagari"
Repository = "https://github.com/in-rolls/legacy_devanagari"
Issues = "https://github.com/in-rolls/legacy_devanagari/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_devanagari"]

[dependency-groups]
dev = ["ruff>=0.14", { include-group = "test" }]
test = ["pytest>=8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
# Akruti puts Devanagari glyphs on Latin code points; ´ is its subscript ्र,
# so test strings hold it on purpose.
allowed-confusables = ["´"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
